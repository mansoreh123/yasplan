    <div class="gap"><button class="btn" data-a="${q.mode==='unit'?'quiz':'lvExam'}" data-id="${q.id}">آزمون دوباره</button><button class="btn ghost" data-a="cqBack">${q.mode==='unit'?'برگشت به درس':'برگشت به درس‌ها'}</button></div></div>`;
  }
  const c=q.qs[q.i];
  const head=`<div class="muted">${esc(title)} · سؤال ${fa(q.i+1)} از ${fa(q.qs.length)}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${Math.round(q.i/q.qs.length*100)}%"></i></div>`;
  let body='';
  if(c.t==='en2fa')body=`<div class="qbig">${esc(c.q)}</div><div style="text-align:center;margin-bottom:8px"><button class="spk" data-a="say" data-t="${esc(c.say)}" aria-label="پخش صدا">🔊</button></div><p class="muted" style="text-align:center">معنی درست کدام است؟</p>`;
  else if(c.t==='listen')body=`<div style="text-align:center;margin:10px 0"><button class="spk" style="width:76px;height:76px;font-size:34px" data-a="say" data-t="${esc(c.say)}" aria-label="پخش صدا">🔊</button></div><p class="muted" style="text-align:center">گوش کن و کلمه‌ی درست را انتخاب کن</p>`;
  else if(c.t==='pic')body=`<div class="prompt">${c.em}</div><p class="muted" style="text-align:center">این تصویر به انگلیسی چه می‌شود؟</p>`;
  else body=`<div class="qfill">${esc(c.q)}</div><p class="muted" style="text-align:center">جای خالی را پر کن</p>`;
  const enOpts=c.t!=='en2fa';
  const opts=c.opts.map((o,i)=>{let cl='';if(q.picked!==null){if(o===c.ans)cl='right';else if(i===q.picked)cl='wrong'}return `<button class="opt ${enOpts?'en':''} ${cl}" data-a="pick" data-i="${i}">${esc(o)}</button>`}).join('');
  if(q.picked===null&&(c.t==='listen'||c.t==='en2fa')&&!c.sp){c.sp=true;setTimeout(()=>{if(U.cq===q&&q.qs[q.i]===c&&q.picked===null)speak(c.say)},350)}
  return `<div class="card">${head}${body}${opts}${q.picked!==null?`<button class="btn" style="width:100%;margin-top:8px" data-a="qNext">${q.i+1>=q.qs.length?'دیدن نتیجه':'بعدی'}</button>`:''}</div>`;
}
A.pick=d=>{
  const q=U.cq;if(!q||q.picked!==null)return;q.picked=+d.i;const c=q.qs[q.i];const right=c.opts[q.picked]===c.ans;
  if(right){q.score++;sndTick()}else sndWrong();
  render();if(c.t!=='fill'&&c.say)setTimeout(()=>speak(c.say),250);
};
A.qNext=()=>{
  const q=U.cq;q.i++;q.picked=null;
  if(q.i>=q.qs.length){q.fin=true;
    if(q.score/q.qs.length>=.8){if(q.mode==='unit')S.course.done[q.id]=true;else S.course.exam[q.id]=true;save();render();celebrate(q.mode==='unit'?'آفرین! درس تموم شد':'آفرین! سطح تموم شد',q.mode==='unit'?'🎓':'🏆');return}}
  render();scrollTo(0,0);
};
A.cqBack=()=>{const m=U.cq.mode;U.cq=null;if(m==='level')U.unit=null;render();scrollTo(0,0)};

/* ============ settings / backup ============ */
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
A.settings=()=>{
  const m=modal(`<div class="row between"><h3>تنظیمات</h3><button class="x" data-a="closeSet" aria-label="بستن">×</button></div>
  <div class="switch"><div><b>صدای افکت‌ها</b><div class="muted">تیک، تشویق، تایمر و آب</div></div><button class="pill ${S.mute?'':'on'}" data-a="mute">${S.mute?'خاموش':'روشن'}</button></div>
  <label class="l" style="margin-top:8px">حالت نمایش</label><div class="chips">${[['','خودکار'],['light','روشن'],['dark','تیره']].map(t=>`<button class="pill ${S.theme===t[0]?'on':''}" data-a="theme" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  <label class="l" style="margin-top:14px">عکس بالای صفحه</label><div class="row" style="flex-wrap:wrap"><button class="btn sm" data-a="pickPhoto">عکس خودم 📷</button>${S.cover?'<button class="btn danger sm" data-a="noPhoto">برداشتن عکس</button>':''}</div>
  <label class="l" style="margin-top:14px">پشتیبان‌گیری از اطلاعات</label><div class="row" style="flex-wrap:wrap"><button class="btn ghost sm" data-a="backup">کپی پشتیبان</button><button class="btn ghost sm" data-a="restore">بازیابی از پشتیبان</button></div>
  <p class="muted" style="margin-top:12px">اطلاعاتت فقط روی همین دستگاه و مرورگر ذخیره می‌شود. گاهی یک پشتیبان کپی کن و جایی نگه دار.</p>`);
  m.id='setModal';
};
A.closeSet=()=>{const m=$('#setModal');if(m)m.remove()};
A.mute=()=>{S.mute=!S.mute;save();A.closeSet();A.settings();if(!S.mute)sndPop()};
A.theme=d=>{S.theme=d.t;applyTheme();save();A.closeSet();A.settings()};
A.pickPhoto=()=>$('#coverFile').click();
A.noPhoto=()=>{S.cover='';save();renderHero();A.closeSet()};
$('#coverFile').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,900/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    S.cover=c.toDataURL('image/jpeg',.75);save();renderHero();A.closeSet();toast('عکس گذاشته شد 🌷')};img.src=r.result};r.readAsDataURL(file);e.target.value='';
});
function showBackup(txt){const m=modal(`<div class="row between"><h3>پشتیبان</h3><button class="x" data-c aria-label="بستن">×</button></div><p class="muted">همه‌ی متن زیر را کپی کن و جایی نگه دار.</p><textarea class="in bkp" readonly>${esc(txt)}</textarea>`);m.querySelector('[data-c]').onclick=()=>m.remove();const ta=m.querySelector('textarea');ta.focus();ta.select()}
A.backup=()=>{const txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(()=>toast('پشتیبان کپی شد 💾'),()=>showBackup(txt))}catch(e){showBackup(txt)}};
A.restore=()=>{
  const m=modal(`<div class="row between"><h3>بازیابی</h3><button class="x" data-c aria-label="بستن">×</button></div><p class="muted">متن پشتیبان را اینجا بچسبان. اطلاعات فعلی جایگزین می‌شود.</p><textarea class="in bkp" placeholder="متن پشتیبان…"></textarea><button class="btn" style="width:100%;margin-top:10px" data-go>بازیابی</button>`);
  m.querySelector('[data-c]').onclick=()=>m.remove();
  m.querySelector('[data-go]').onclick=()=>{try{const o=JSON.parse(m.querySelector('textarea').value);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;localStorage.setItem(KEY,JSON.stringify(o));location.reload()}catch(e){toast('متن پشتیبان درست نیست')}};
};

/* ============ wiring ============ */
function vClock(){return vClock0()+runningTimersCard()}
A.group=d=>{U.group=d.g;stopAll();render();scrollTo(0,0)};
A.sub=d=>{U.sub[U.group]=d.s;stopAll();render()};
const VIEWS={today:vToday,quick:vQuick,chores:vChores,cal:vCal,rem:vRem,clock:vClock,exp:vExp,sav:vSav,att:vAtt,per:vPer,sew:nbPage('sew'),gym:nbPage('gym'),
  lang:vLang,words:vWords,design:()=>sectionTimer('design')+vDesign0()+nbCard('design'),pc:()=>sectionTimer('pc')+vPc0()+nbCard('pc'),psy:()=>sectionTimer('psy')+vPsy0()+nbCard('psy'),
  exam:nbPage('exam'),cook:nbPage('cook'),audio:nbPage('audio')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const fn=A[b.dataset.a];if(fn){if(b.tagName==='A')e.preventDefault();fn(b.dataset,b,e)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const fn=F[f.dataset.f];if(fn)fn(f,e)});
let pdT=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='wq'){U.wq=t.value;const l=$('#wlist');if(l)l.innerHTML=wordsList(U.wq)}
  else if(t.dataset&&t.dataset.pd){setPath(ensurePd(U.day),t.dataset.pd,t.value);clearTimeout(pdT);pdT=setTimeout(save,350)}
});
addEventListener('pagehide',()=>{try{save()}catch(e){}});

let tickN=0,heroDay=new Date().getDate();
function tick(){
  const n=new Date();
  if(n.getDate()!==heroDay){heroDay=n.getDate();renderHero()}
  const hc=$('#hClock');if(hc)hc.textContent=fa(pad(n.getHours())+':'+pad(n.getMinutes()));
  const bc=$('#bigClock');
  if(bc){bc.textContent=fa(pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds()));
    const s=n.getSeconds(),m=n.getMinutes()+s/60,h=(n.getHours()%12)+m/60;
    [['hH',h*30],['hM',m*6],['hS',s*6]].forEach(([id,a])=>{const el=document.getElementById(id);if(el)el.setAttribute('transform','rotate('+a+' 100 100)')})}
  const now=Date.now();
  for(const id in TM){const m=TM[id];if(!m.run)continue;m.rem=Math.max(0,(m.end-now)/1000);
    document.querySelectorAll('[data-tm="'+id+'"]').forEach(e=>e.textContent=fmt(m.rem));
    const c=Math.ceil(m.rem);if(c<=5&&c>0&&m._c!==c){m._c=c;sndCount()}
    if(m.rem<=0)tmDone(id)}
  if(MT.run){MT.rem=Math.max(0,(MT.end-now)/1000);const tx=$('#mtText'),rg=$('#mtRing');if(tx)tx.textContent=fmt(MT.rem);if(rg)rg.setAttribute('stroke-dashoffset',(TC*(1-MT.rem/MT.total)).toFixed(1));
    const c=Math.ceil(MT.rem);if(c<=5&&c>0&&MT._c!==c){MT._c=c;sndCount()}
    if(MT.rem<=0){MT.run=false;notify('تایمر تموم شد ⏱️','وقتش تموم شد. یه استراحت کوچولو بکن 🌸');render()}}
  if(++tickN%10===0)checkDue();
}
/* restore timers that kept running while the page was closed */
Object.keys(TM).forEach(id=>{const m=TM[id];if(m.run){m.rem=Math.max(0,(m.end-Date.now())/1000);if(m.rem<=0){m.run=false;m.rem=0;if(Date.now()-m.end<10*60000)setTimeout(()=>notify('تایمر تموم شد ⏱️',m.label||''),900)}}});
save();
renderHero();render();
setInterval(tick,500);setTimeout(checkDue,1200);

</script>
